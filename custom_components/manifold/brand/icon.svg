       read as the playlist icon they would otherwise be. -->
  <g stroke="#fff" fill="none" stroke-linecap="round">
    <path d="M104 168 H232" stroke-width="40"/>
    <path d="M148 256 H232" stroke-width="40"/>
    <path d="M104 344 H232" stroke-width="40"/>
    <path d="M254 140 V372" stroke-width="72"/>
  </g>
  <path d="M312 178 L420 256 L312 334 Z" fill="#fff" stroke="#fff" stroke-width="30"
        stroke-linejoin="round"/>
