<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF375F"/>
      <stop offset="0.55" stop-color="#A93AE0"/>
      <stop offset="1" stop-color="#2DB3E8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" ry="115" fill="url(#tile)"/>
  <!-- Three branches into one body, out through a play triangle: what a manifold
